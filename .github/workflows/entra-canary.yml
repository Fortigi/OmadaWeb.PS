name: Entra Canary

# The scheduled pipeline the E2E tag was always excluded for (roadmap E5, issue #33).
#
# Two canaries against one tenant, in two jobs that fail independently.
#
# THE SIGN-IN CANARY signs in to Microsoft Entra ID once a day, in a real browser, with a real
# account, and fails when credential autofill stops recognizing Microsoft's sign-in screens. That is
# the module's only dependency on Microsoft's DOM, and Microsoft changes it on its own schedule - so
# without this the detection mechanism is a user bug report.
#
# A red sign-in canary means "autofill needs a selector update" - $Script:EntraSignInElementId in
# OmadaWeb.PS/OmadaWeb.PS.psm1, see issue #32 - and not "login is broken". Since #52 a selector break
# degrades autofill and hands the window to the user; this run is how that gets noticed first.
#
# THE SERVICE-PRINCIPAL CANARY authenticates with the client-credentials grant, once per credential
# form the module documents, and proves that Microsoft still accepts the client assertion
# New-OAuthClientAssertion signs. Unit tests mock the token endpoint, and a mock accepts any JWT.
# It opens no browser, so a red run there is never a sign-in page change.
#
# The tenant setup, the secrets and the response to a red run are in docs/entra-canary.md.

on:
  schedule:
    # Well clear of the nightly build at 01:17, so a runner queue shared between them never makes one
    # look like the other's failure.
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      browser_host_check_only:
        description: 'Only check that the runner can host a WebView2 window, and skip the sign-in. Use to validate a new runner image without involving the tenant.'
        required: false
        default: false
        type: boolean

# Only 'issues: write' is elevated, and only so a failure can file the alert. Nothing here needs to
# write to the repository.
permissions:
  contents: read
  issues: write

# Never cancel a run in progress: this drives a real sign-in against a real account, and killing it
# half way leaves a browser profile and a listener behind on the runner for no benefit. A queued
# duplicate simply waits.
concurrency:
  group: entra-signin-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Entra ID sign-in
    runs-on: windows-latest
    # Three scenarios, each of which may be retried once for a flake. Two of them are watched for a
    # fixed period rather than run to completion, because they are sign-ins that deliberately do not
    # complete - see Tests/E2E/EntraSignInCanary.Tests.ps1.
    timeout-minutes: 45

    # Holds the four canary secrets. An environment rather than repository secrets, so that no
    # pull-request workflow can reach them.
    environment: entra-canary

    outputs:
      outcome: ${{ steps.canary.outputs.outcome }}
      report: ${{ steps.canary.outputs.report }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install modules
        shell: pwsh
        run: ./Build/InstallModules.ps1

      # Built rather than run from source, so the canary exercises the same single .psm1 that ships
      # to the Gallery. A sign-in that only works before the module is assembled is not a sign-in
      # that works for a user.
      - name: Build the module
        shell: pwsh
        run: ./Build/build.ps1 -Task Build -BuildVersion '0.0.0'

      # Runs before the sign-in, and fails the job on its own. Without it, a runner that cannot open a
      # browser window fails every canary assertion at once and the diagnostic reads "the sign-in page
      # was not recognized" - true, and pointing at exactly the wrong thing. A maintainer would go
      # looking at Microsoft's markup while the real answer was that no browser ever opened.
      #
      # Deliberately does not file an issue when it fails: nothing about the sign-in page has changed,
      # so an alert saying otherwise would be a lie. The failed run is the signal.
      - name: Check the runner can host a browser
        shell: pwsh
        run: ./Tests/E2E/Test-CanaryBrowserHost.ps1

      - name: Run the canary
        id: canary
        if: inputs.browser_host_check_only != true
        shell: pwsh
        env:
          OMADAWEBPS_CANARY_TENANT_ID: ${{ secrets.CANARY_TENANT_ID }}
          OMADAWEBPS_CANARY_CLIENT_ID: ${{ secrets.CANARY_CLIENT_ID }}
          OMADAWEBPS_CANARY_USERNAME: ${{ secrets.CANARY_USERNAME }}
          OMADAWEBPS_CANARY_PASSWORD: ${{ secrets.CANARY_PASSWORD }}
          OMADAWEBPS_CANARY_PORT: '8400'
          OMADAWEBPS_STRICTMODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'

          # Masked before anything else runs. GitHub masks a secret it injected, but the tenant id
          # and the account name arrive as ordinary strings in places it does not track - a Pester
          # failure message, an exception - and this run files a public issue.
          foreach ($name in 'OMADAWEBPS_CANARY_TENANT_ID','OMADAWEBPS_CANARY_CLIENT_ID','OMADAWEBPS_CANARY_USERNAME','OMADAWEBPS_CANARY_PASSWORD') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              Write-Host "::add-mask::$value"
            }
          }

          if ([string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_TENANT_ID) -or
              [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_PASSWORD)) {
            Write-Host "::notice title=Canary not configured::The 'entra-canary' environment has no canary secrets, so nothing was signed in. See docs/entra-canary.md."
            "outcome=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "report=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $modulePath = Join-Path $env:GITHUB_WORKSPACE 'buildoutput/OmadaWeb.PS/OmadaWeb.PS.psm1'
          if (-not (Test-Path $modulePath)) {
            throw "The built module was not found at '$modulePath'."
          }

          # Each attempt runs in a child process with a deadline, rather than in this one.
          #
          # A browser sign-in has no natural end when nobody is driving it. If the automation hands
          # over to manual - which is exactly what a selector break makes it do - it then waits for a
          # user who does not exist on a runner. The first run of this workflow after the console fix
          # did precisely that: the window opened, the timer ticked for 29 minutes, and the job
          # timeout killed the step. A killed step reports nothing at all: no assertions, no
          # diagnostic, no alert. The canary was silent about the very failure it was watching for.
          #
          # In-process there is nothing to interrupt: the WinForms dialog blocks the thread it is
          # shown on. A child process can simply be killed, which turns a hang into a reported
          # failure - and that is the difference between a canary and a job that sometimes times out.
          # Generous for a real sign-in (no MFA on this account, so it is seconds) and short enough
          # that two attempts plus the flake pause fit inside the job timeout with room to report.
          # The sign-in that completes is quick - no MFA on this account, so it is seconds - while
          # the two that deliberately do not complete are watched for a fixed 135 seconds and then
          # stopped from inside the test. Both numbers leave room for a slow runner and are short
          # enough that every scenario plus its flake retry fits inside the job timeout.
          $attemptTimeoutSeconds = @{
            PasswordAutofill = 300
            UserNameOnly     = 330
            NoUserName       = 330
          }

          function Invoke-CanaryAttempt {
            param([string]$Scenario, [int]$Attempt)

            $label = "{0}-{1}" -f $Scenario, $Attempt
            $timeout = $attemptTimeoutSeconds[$Scenario]

            $diagnosticPath = Join-Path $env:RUNNER_TEMP ("canary-diagnostic-{0}.txt" -f $label)
            Remove-Item -LiteralPath $diagnosticPath -Force -ErrorAction SilentlyContinue

            $resultPath = Join-Path $env:GITHUB_WORKSPACE ("buildoutput/CanaryResults-{0}.xml" -f $label)
            $summaryPath = Join-Path $env:RUNNER_TEMP ("canary-summary-{0}.json" -f $label)
            Remove-Item -LiteralPath $resultPath, $summaryPath -Force -ErrorAction SilentlyContinue

            $arguments = @(
              "-NoLogo", "-NoProfile",
              "-File", ('"{0}"' -f (Join-Path $env:GITHUB_WORKSPACE 'Tests/E2E/Invoke-CanaryAttempt.ps1')),
              "-ModulePath", ('"{0}"' -f $modulePath),
              "-ResultPath", ('"{0}"' -f $resultPath),
              "-SummaryPath", ('"{0}"' -f $summaryPath),
              "-DiagnosticPath", ('"{0}"' -f $diagnosticPath),
              "-Scenario", $Scenario
            )

            # Captured to a file rather than streamed, so that a killed attempt still has a trace to
            # read. It is echoed into the job log below either way; a timed-out attempt whose output
            # went nowhere is what made the first stalled run unexplainable.
            $childLog = Join-Path $env:RUNNER_TEMP ("canary-output-{0}.log" -f $label)
            $childErrorLog = Join-Path $env:RUNNER_TEMP ("canary-error-{0}.log" -f $label)

            $process = Start-Process -FilePath (Get-Command pwsh.exe).Source -ArgumentList $arguments -NoNewWindow -PassThru `
              -RedirectStandardOutput $childLog -RedirectStandardError $childErrorLog
            $timedOut = -not $process.WaitForExit($timeout * 1000)

            if ($timedOut) {
              Write-Host ("::warning title=Canary attempt timed out::{0} attempt {1} was still running after {2} seconds and was stopped." -f $Scenario, $Attempt, $timeout)
              try { $process.Kill($true) } catch { Write-Host "Could not stop the attempt cleanly: $($_.Exception.Message)" }
              # Every browser process the sign-in started outlives the runspace that opened it, and
              # the next attempt must not inherit one.
              Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }

            Write-Host ("::group::{0} attempt {1} output" -f $Scenario, $Attempt)
            Get-Content -LiteralPath $childLog -ErrorAction SilentlyContinue | Write-Host
            Get-Content -LiteralPath $childErrorLog -ErrorAction SilentlyContinue | Write-Host
            Write-Host "::endgroup::"

            $diagnostic = ''
            if (Test-Path -LiteralPath $diagnosticPath) {
              $diagnostic = Get-Content -LiteralPath $diagnosticPath -Raw
            }

            if ($timedOut) {
              # A killed attempt never reached the assertion that writes the diagnostic file, so the
              # last screen the automation named in its trace is the only account of where it stopped
              # - and it is a good one: it distinguishes a page the module could not read from one
              # Entra refused.
              $lastScreen = @(Select-String -LiteralPath $childLog -Pattern "Screen '.*', action '.*'" -ErrorAction SilentlyContinue |
                Select-Object -Last 1 | ForEach-Object { $_.Line.Trim() })

              $failure = @("- [$Scenario] The attempt did not finish within $timeout seconds and was stopped. Nobody is at this browser, so a sign-in that waits for a user waits forever - the scenarios that expect that stop themselves from the inside, so reaching this means one of them did not.")
              if ($lastScreen.Count -gt 0) {
                $failure += "- [$Scenario] The last page the automation named was: $($lastScreen[0])"
              }
              else {
                $failure += "- [$Scenario] The automation never named a page, so it did not get as far as reading one. Look at the trace above."
              }

              return [pscustomobject]@{
                Failed     = 1
                Passed     = 0
                Skipped    = 0
                Diagnostic = $diagnostic
                Failure    = $failure
              }
            }

            if (-not (Test-Path -LiteralPath $summaryPath)) {
              return [pscustomobject]@{
                Failed     = 1
                Passed     = 0
                Skipped    = 0
                Diagnostic = $diagnostic
                Failure    = @("- [$Scenario] The attempt exited with code $($process.ExitCode) without reporting a result. See the output above.")
              }
            }

            $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json

            return [pscustomobject]@{
              Failed     = [int]$summary.Failed
              Passed     = [int]$summary.Passed
              Skipped    = [int]$summary.Skipped
              Diagnostic = $diagnostic
              Failure    = @($summary.Failure | ForEach-Object { $_ -replace '^- ', ("- [{0}] " -f $Scenario) })
            }
          }

          # Three sign-ins, one after the other. They cannot share a run: each needs its own browser
          # window, and two of them are watched for a fixed period rather than run to completion.
          #
          #   PasswordAutofill - a user name and a password. Completes, and is the original canary:
          #                      it watches whether Microsoft's screens are still recognized.
          #   UserNameOnly     - a user name and no password. Must reach Entra as part of the request
          #                      (login_hint), must arrive at the password page, must not submit an
          #                      empty password, and must hand the window back saying it is waiting.
          #   NoUserName       - neither. Must add nothing to the request and drive nothing at all.
          $scenarios = @('PasswordAutofill', 'UserNameOnly', 'NoUserName')

          $lines = [System.Collections.Generic.List[string]]::new()
          $failures = [System.Collections.Generic.List[string]]::new()
          $diagnostics = [System.Collections.Generic.List[string]]::new()
          $totalFailed = 0
          $totalSkipped = 0
          $totalPassed = 0

          foreach ($scenario in $scenarios) {
            $first = Invoke-CanaryAttempt -Scenario $scenario -Attempt 1
            $final = $first

            if ($first.Failed -gt 0) {
              # The flake policy. Microsoft's sign-in service has transient bad minutes, and a canary
              # that alerts on one of them gets muted by its audience, which is the only failure mode
              # worse than not having a canary. One automatic retry per scenario, and a warning
              # either way so a run that needed the retry is still visible.
              Write-Host ("::warning title=Canary retry::The {0} attempt failed. Retrying once in 120 seconds before alerting." -f $scenario)
              Start-Sleep -Seconds 120
              $final = Invoke-CanaryAttempt -Scenario $scenario -Attempt 2
            }

            $lines.Add(("{0}: {1} passed, {2} failed{3}." -f $scenario, $final.Passed, $final.Failed, $(if ($first.Failed -gt 0) { " (after the flake retry)" } else { "" })))

            $totalFailed += $final.Failed
            $totalPassed += $final.Passed
            $totalSkipped += $final.Skipped

            $final.Failure | ForEach-Object { $failures.Add($_) }

            if (-not [string]::IsNullOrWhiteSpace($final.Diagnostic)) {
              $diagnostics.Add(("{0}:`n{1}" -f $scenario, $final.Diagnostic.Trim()))
            }
          }

          # The tests decided for themselves that they are not configured. Reported rather than
          # passed off as a success, so a canary that has silently stopped running is visible.
          if ($totalSkipped -gt 0 -and $totalPassed -eq 0 -and $totalFailed -eq 0) {
            Write-Host "::notice title=Canary skipped::The canary tests reported themselves as not configured."
            "outcome=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "report=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          if ($failures.Count -gt 0) {
            $lines.Add("")
            $lines.Add("Failed assertions:")
            $failures | ForEach-Object { $lines.Add($_) }
          }

          if ($diagnostics.Count -gt 0) {
            $lines.Add("")
            $lines.Add("Diagnostic reported by Switch-ToManualLogin:")
            $lines.Add("")
            $lines.Add('```')
            $diagnostics | ForEach-Object { $lines.Add($_) }
            $lines.Add('```')
          }

          $report = $lines -join "`n"

          # Belt and braces over ::add-mask::. This text is about to become a public issue, and a
          # value that reached it through a channel GitHub does not track would be published before
          # anyone could react.
          foreach ($name in 'OMADAWEBPS_CANARY_TENANT_ID','OMADAWEBPS_CANARY_CLIENT_ID','OMADAWEBPS_CANARY_USERNAME','OMADAWEBPS_CANARY_PASSWORD') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              $report = $report.Replace($value, '***')
            }
          }

          $outcome = if ($totalFailed -gt 0) { 'failure' } else { 'success' }
          "outcome=$outcome" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $delimiter = "REPORT-" + [guid]::NewGuid().ToString('N')
          "report<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $report | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($totalFailed -gt 0) {
            throw "One or more Entra sign-in canary scenarios failed twice. See the report above."
          }

      - name: Upload the canary test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CanaryResults
          path: buildoutput/CanaryResults-*.xml
          if-no-files-found: ignore

      # Scheduled-workflow failure mail goes to whoever last touched the file and is easy to miss, so
      # the alert is an issue: it is durable, it carries the diagnostic, and it closes itself when
      # the canary recovers.
      # Gated on the canary having actually reached a verdict, not merely on the job having failed.
      # A checkout or build failure leaves this output empty, and alerting on that would file an
      # issue saying Microsoft changed its sign-in page when nothing had even tried to sign in.
      - name: Open or close the canary alert
        if: always() && (steps.canary.outputs.outcome == 'success' || steps.canary.outputs.outcome == 'failure')
        uses: actions/github-script@v9
        env:
          CANARY_OUTCOME: ${{ steps.canary.outputs.outcome }}
          CANARY_REPORT: ${{ steps.canary.outputs.report }}
        with:
          script: |
            const title = 'Entra sign-in canary is failing';
            const outcome = process.env.CANARY_OUTCOME;
            const report = process.env.CANARY_REPORT || '(no report captured)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'canary',
              per_page: 100,
            });
            const alert = existing.data.find(issue => issue.title === title);

            if (outcome === 'success') {
              if (alert) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  body: `The canary passed again in [run ${context.runId}](${runUrl}). Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  state: 'closed',
                });
              }
              return;
            }

            // A selector break is the failure this canary was built for, but it is not the only one
            // it can catch - and issue #79 was filed by an earlier version of this text telling a
            // maintainer to go and edit the selector table over a console-handle bug in the module.
            // So the alert asks the reader to read the report first, and only claims a selector
            // break when the report carries the diagnostic that proves one.
            const looksLikeSelectorBreak = report.includes('Switch-ToManualLogin');

            const diagnosis = looksLikeSelectorBreak
              ? [
                  `**What this means.** Credential autofill no longer recognizes a Microsoft sign-in screen. Signing in still works — a selector break degrades autofill, not login — but every user supplying \`-Credential\` now has to type it themselves.`,
                  ``,
                  `**What to do.** Update \`$Script:EntraSignInElementId\` in \`OmadaWeb.PS/OmadaWeb.PS.psm1\` from the diagnostic below, then re-run this workflow. See \`docs/entra-canary.md\` and issue #32.`,
                ]
              : [
                  `**No selector diagnostic was captured, so do not assume the sign-in page changed.** \`Switch-ToManualLogin\` did not report an unrecognized page; the sign-in failed some other way — in this module, in the tenant, or on the runner.`,
                  ``,
                  `**What to do.** Read the failed assertions below first. "Actually travelled through Entra and back" failing with 0 means the browser never reached Microsoft, which rules the selector table out entirely. See the response guide in \`docs/entra-canary.md\`.`,
                ];

            const body = [
              `A scheduled Entra ID sign-in canary scenario failed twice in a row, so this is not a transient Microsoft hiccup. The report below names the scenario.`,
              ``,
              ...diagnosis,
              ``,
              `[Run ${context.runId}](${runUrl})`,
              ``,
              report,
            ].join('\n');

            if (alert) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                body,
              });
              return;
            }

            // The label is created on demand: a fresh clone of this repository has no 'canary'
            // label, and a missing one would fail the create call rather than the canary.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'canary',
                color: 'fbca04',
                description: 'Raised automatically by the scheduled Entra sign-in canary',
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['canary'],
            });

  # The second canary: unattended authentication, -AuthenticationType OAuth, the client-credentials
  # grant that scheduled tasks and CI pipelines use. It shares this file because it shares the tenant,
  # the environment and the alerting - and it is a separate job because it shares nothing else.
  #
  # Nothing here opens a browser, so a runner that cannot host one has no bearing on it, and a failure
  # can never mean "Microsoft changed a sign-in page". Keeping the two apart is what stops one
  # canary's alert from being written in the other's vocabulary.
  #
  # What it proves that a unit test cannot: that Microsoft still accepts the client assertion
  # New-OAuthClientAssertion signs. A mock accepts any JWT; only Entra can reject a bad one.
  service-principal:
    name: Entra ID service principal
    runs-on: windows-latest
    # Four scenarios of a few seconds each, plus one flake retry. Generous for what it does; the cost
    # of an over-long timeout here is nothing, and the cost of a short one is a false alert.
    timeout-minutes: 30

    # The browser-host dispatch is about the runner's ability to open a window, which this job never
    # does. Running it then would sign in to the tenant for no reason.
    if: inputs.browser_host_check_only != true

    environment: entra-canary

    outputs:
      outcome: ${{ steps.canary.outputs.outcome }}
      report: ${{ steps.canary.outputs.report }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install modules
        shell: pwsh
        run: ./Build/InstallModules.ps1

      # Built rather than run from source, for the same reason the sign-in canary is: the ships-to-the-
      # Gallery .psm1 is what a scheduled task will import.
      - name: Build the module
        shell: pwsh
        run: ./Build/build.ps1 -Task Build -BuildVersion '0.0.0'

      - name: Run the service-principal canary
        id: canary
        shell: pwsh
        env:
          OMADAWEBPS_CANARY_TENANT_ID: ${{ secrets.CANARY_TENANT_ID }}
          OMADAWEBPS_CANARY_SP_CLIENT_ID: ${{ secrets.CANARY_SP_CLIENT_ID }}
          OMADAWEBPS_CANARY_SP_CLIENT_SECRET: ${{ secrets.CANARY_SP_CLIENT_SECRET }}
          OMADAWEBPS_CANARY_SP_CERT_PFX_BASE64: ${{ secrets.CANARY_SP_CERT_PFX_BASE64 }}
          OMADAWEBPS_CANARY_SP_CERT_PASSWORD: ${{ secrets.CANARY_SP_CERT_PASSWORD }}
          OMADAWEBPS_CANARY_SP_RESOURCE_URI: ${{ secrets.CANARY_SP_RESOURCE_URI }}
          OMADAWEBPS_CANARY_SP_RESOURCE_CLIENT_ID: ${{ secrets.CANARY_SP_RESOURCE_CLIENT_ID }}
          OMADAWEBPS_CANARY_SP_APP_ROLE: ${{ secrets.CANARY_SP_APP_ROLE }}
          OMADAWEBPS_CANARY_SP_SECRET_EXPIRY: ${{ secrets.CANARY_SP_SECRET_EXPIRY }}
          OMADAWEBPS_CANARY_PORT: '8401'
          OMADAWEBPS_STRICTMODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'

          # Masked before anything else runs, for the same reason as the sign-in job: identifiers
          # arrive as ordinary strings in places GitHub does not track - a Pester failure message, an
          # exception - and this run files a public issue.
          $secretNames = @(
            'OMADAWEBPS_CANARY_TENANT_ID',
            'OMADAWEBPS_CANARY_SP_CLIENT_ID',
            'OMADAWEBPS_CANARY_SP_CLIENT_SECRET',
            'OMADAWEBPS_CANARY_SP_CERT_PFX_BASE64',
            'OMADAWEBPS_CANARY_SP_CERT_PASSWORD',
            'OMADAWEBPS_CANARY_SP_RESOURCE_URI',
            'OMADAWEBPS_CANARY_SP_RESOURCE_CLIENT_ID'
          )
          foreach ($name in $secretNames) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              Write-Host "::add-mask::$value"
            }
          }

          # Everything except the credentials themselves. Which credential forms can run is decided
          # per scenario below, so a tenant provisioned with only one of them still runs what it can.
          if ([string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_TENANT_ID) -or
              [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_RESOURCE_URI) -or
              [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_RESOURCE_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_APP_ROLE)) {
            Write-Host "::notice title=Service-principal canary not configured::The 'entra-canary' environment has no service-principal secrets, so no token was requested. See docs/entra-canary.md."
            "outcome=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "report=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          # Rotation is a person's job, and the point of saying so here is that they hear about it
          # before the canary goes red rather than on the morning it does. A credential inside the
          # window is a warning annotation, never a failure: nothing is broken yet.
          $expiryWarningDays = 30

          if (-not [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_SECRET_EXPIRY)) {
            $secretExpiry = [datetime]::MinValue
            if ([datetime]::TryParse($env:OMADAWEBPS_CANARY_SP_SECRET_EXPIRY, [ref]$secretExpiry)) {
              $daysLeft = [int]($secretExpiry.ToUniversalTime() - [datetime]::UtcNow).TotalDays
              if ($daysLeft -lt $expiryWarningDays) {
                Write-Host ("::warning title=Canary client secret expiring::The service-principal canary's client secret expires in {0} days ({1:yyyy-MM-dd}). Re-run Build/New-EntraCanaryConfiguration.ps1 with -RotateServicePrincipalCredential -GitHubRepository <owner/repo>." -f $daysLeft, $secretExpiry)
              }
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_CERT_PFX_BASE64)) {
            # Read from the PFX this job already holds rather than from Graph, which would mean giving
            # the runner directory credentials it otherwise has no use for.
            $certificate = $null
            try {
              $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                [Convert]::FromBase64String($env:OMADAWEBPS_CANARY_SP_CERT_PFX_BASE64),
                $env:OMADAWEBPS_CANARY_SP_CERT_PASSWORD,
                [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

              $daysLeft = [int]($certificate.NotAfter.ToUniversalTime() - [datetime]::UtcNow).TotalDays
              if ($daysLeft -lt $expiryWarningDays) {
                Write-Host ("::warning title=Canary certificate expiring::The service-principal canary's client certificate expires in {0} days ({1:yyyy-MM-dd}). Re-run Build/New-EntraCanaryConfiguration.ps1 with -RotateServicePrincipalCredential -GitHubRepository <owner/repo>." -f $daysLeft, $certificate.NotAfter)
              }
            }
            catch {
              Write-Host ("::warning title=Canary certificate unreadable::The stored PFX could not be opened, so its expiry is unknown: {0}" -f $_.Exception.Message)
            }
            finally {
              if ($null -ne $certificate) { $certificate.Dispose() }
            }
          }

          $modulePath = Join-Path $env:GITHUB_WORKSPACE 'buildoutput/OmadaWeb.PS/OmadaWeb.PS.psm1'
          if (-not (Test-Path $modulePath)) {
            throw "The built module was not found at '$modulePath'."
          }

          # Same child-process runner as the sign-in canary, for the reporting rather than the
          # deadline: the JSON summary, the JUnit result and the diagnostic file are what this step
          # turns into a report. The deadline is a backstop - an HTTP request that has not finished in
          # two minutes is not going to.
          $attemptTimeoutSeconds = 120

          function Invoke-ServicePrincipalAttempt {
            param([string]$Scenario, [int]$Attempt)

            $label = "{0}-{1}" -f $Scenario, $Attempt

            $diagnosticPath = Join-Path $env:RUNNER_TEMP ("sp-canary-diagnostic-{0}.txt" -f $label)
            $resultPath = Join-Path $env:GITHUB_WORKSPACE ("buildoutput/CanaryResults-{0}.xml" -f $label)
            $summaryPath = Join-Path $env:RUNNER_TEMP ("sp-canary-summary-{0}.json" -f $label)
            Remove-Item -LiteralPath $diagnosticPath, $resultPath, $summaryPath -Force -ErrorAction SilentlyContinue

            $arguments = @(
              "-NoLogo", "-NoProfile",
              "-File", ('"{0}"' -f (Join-Path $env:GITHUB_WORKSPACE 'Tests/E2E/Invoke-CanaryAttempt.ps1')),
              "-ModulePath", ('"{0}"' -f $modulePath),
              "-ResultPath", ('"{0}"' -f $resultPath),
              "-SummaryPath", ('"{0}"' -f $summaryPath),
              "-DiagnosticPath", ('"{0}"' -f $diagnosticPath),
              "-TestFile", "EntraServicePrincipalCanary.Tests.ps1",
              "-Scenario", $Scenario
            )

            $childLog = Join-Path $env:RUNNER_TEMP ("sp-canary-output-{0}.log" -f $label)
            $childErrorLog = Join-Path $env:RUNNER_TEMP ("sp-canary-error-{0}.log" -f $label)

            $process = Start-Process -FilePath (Get-Command pwsh.exe).Source -ArgumentList $arguments -NoNewWindow -PassThru `
              -RedirectStandardOutput $childLog -RedirectStandardError $childErrorLog
            $timedOut = -not $process.WaitForExit($attemptTimeoutSeconds * 1000)

            if ($timedOut) {
              Write-Host ("::warning title=Canary attempt timed out::{0} attempt {1} was still running after {2} seconds and was stopped." -f $Scenario, $Attempt, $attemptTimeoutSeconds)
              try { $process.Kill($true) } catch { Write-Host "Could not stop the attempt cleanly: $($_.Exception.Message)" }
            }

            Write-Host ("::group::{0} attempt {1} output" -f $Scenario, $Attempt)
            Get-Content -LiteralPath $childLog -ErrorAction SilentlyContinue | Write-Host
            Get-Content -LiteralPath $childErrorLog -ErrorAction SilentlyContinue | Write-Host
            Write-Host "::endgroup::"

            $diagnostic = ''
            if (Test-Path -LiteralPath $diagnosticPath) {
              $diagnostic = Get-Content -LiteralPath $diagnosticPath -Raw
            }

            if ($timedOut) {
              return [pscustomobject]@{
                Failed     = 1
                Passed     = 0
                Skipped    = 0
                Diagnostic = $diagnostic
                Failure    = @("- [$Scenario] The attempt did not finish within $attemptTimeoutSeconds seconds and was stopped. No browser is involved here, so this is a token request or a loopback listener that hung - read the trace above.")
              }
            }

            if (-not (Test-Path -LiteralPath $summaryPath)) {
              return [pscustomobject]@{
                Failed     = 1
                Passed     = 0
                Skipped    = 0
                Diagnostic = $diagnostic
                Failure    = @("- [$Scenario] The attempt exited with code $($process.ExitCode) without reporting a result. See the output above.")
              }
            }

            $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json

            return [pscustomobject]@{
              Failed     = [int]$summary.Failed
              Passed     = [int]$summary.Passed
              Skipped    = [int]$summary.Skipped
              Diagnostic = $diagnostic
              Failure    = @($summary.Failure | ForEach-Object { $_ -replace '^- ', ("- [{0}] " -f $Scenario) })
            }
          }

          # One scenario per credential form the module documents. They are separate runs because
          # supplying two credentials at once means only one of them is under test: given both,
          # Invoke-OAuth2Authentication uses the certificate and warns that it ignored the secret.
          #
          #   OAuthClientSecret      - -Credential holding the client id and secret.
          #   OAuthCertificateStore  - -OAuthCertificateThumbprint, from CurrentUser\My.
          #   OAuthCertificateFile   - -OAuthCertificatePath, what a container uses.
          #   OAuthCertificateObject - -OAuthCertificate, a certificate the caller already holds.
          $scenarios = @()
          if (-not [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_CLIENT_SECRET)) {
            $scenarios += 'OAuthClientSecret'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:OMADAWEBPS_CANARY_SP_CERT_PFX_BASE64)) {
            $scenarios += @('OAuthCertificateStore', 'OAuthCertificateFile', 'OAuthCertificateObject')
          }

          if ($scenarios.Count -eq 0) {
            Write-Host "::notice title=Service-principal canary not configured::Neither a client secret nor a certificate is stored, so there was nothing to authenticate with. See docs/entra-canary.md."
            "outcome=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "report=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $lines = [System.Collections.Generic.List[string]]::new()
          $failures = [System.Collections.Generic.List[string]]::new()
          $diagnostics = [System.Collections.Generic.List[string]]::new()
          $totalFailed = 0
          $totalSkipped = 0
          $totalPassed = 0

          foreach ($scenario in $scenarios) {
            $first = Invoke-ServicePrincipalAttempt -Scenario $scenario -Attempt 1
            $final = $first

            if ($first.Failed -gt 0) {
              # The same flake policy as the sign-in canary, and for the same reason: Entra's token
              # endpoint has transient bad minutes, and a canary that alerts on one of them gets muted
              # by its audience.
              Write-Host ("::warning title=Canary retry::The {0} attempt failed. Retrying once in 120 seconds before alerting." -f $scenario)
              Start-Sleep -Seconds 120
              $final = Invoke-ServicePrincipalAttempt -Scenario $scenario -Attempt 2
            }

            $lines.Add(("{0}: {1} passed, {2} failed{3}." -f $scenario, $final.Passed, $final.Failed, $(if ($first.Failed -gt 0) { " (after the flake retry)" } else { "" })))

            $totalFailed += $final.Failed
            $totalPassed += $final.Passed
            $totalSkipped += $final.Skipped

            $final.Failure | ForEach-Object { $failures.Add($_) }

            if (-not [string]::IsNullOrWhiteSpace($final.Diagnostic)) {
              $diagnostics.Add(("{0}:`n{1}" -f $scenario, $final.Diagnostic.Trim()))
            }
          }

          if ($totalSkipped -gt 0 -and $totalPassed -eq 0 -and $totalFailed -eq 0) {
            Write-Host "::notice title=Service-principal canary skipped::The canary tests reported themselves as not configured."
            "outcome=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "report=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          if ($failures.Count -gt 0) {
            $lines.Add("")
            $lines.Add("Failed assertions:")
            $failures | ForEach-Object { $lines.Add($_) }
          }

          if ($diagnostics.Count -gt 0) {
            $lines.Add("")
            $lines.Add("What the module reported:")
            $lines.Add("")
            $lines.Add('```')
            $diagnostics | ForEach-Object { $lines.Add($_) }
            $lines.Add('```')
          }

          $report = $lines -join "`n"

          # Belt and braces over ::add-mask::, as in the sign-in job. This text is about to become a
          # public issue.
          foreach ($name in $secretNames) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              $report = $report.Replace($value, '***')
            }
          }

          $outcome = if ($totalFailed -gt 0) { 'failure' } else { 'success' }
          "outcome=$outcome" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $delimiter = "REPORT-" + [guid]::NewGuid().ToString('N')
          "report<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $report | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($totalFailed -gt 0) {
            throw "One or more Entra service-principal canary scenarios failed twice. See the report above."
          }

      - name: Upload the service-principal canary test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ServicePrincipalCanaryResults
          path: buildoutput/CanaryResults-OAuth*.xml
          if-no-files-found: ignore

      # A separate issue from the sign-in canary's, with its own title, so neither overwrites the
      # other's alert and neither is described in the other's vocabulary. Nothing in this job can mean
      # "Microsoft changed a sign-in page", and the body must never say so.
      - name: Open or close the service-principal canary alert
        if: always() && (steps.canary.outputs.outcome == 'success' || steps.canary.outputs.outcome == 'failure')
        uses: actions/github-script@v9
        env:
          CANARY_OUTCOME: ${{ steps.canary.outputs.outcome }}
          CANARY_REPORT: ${{ steps.canary.outputs.report }}
        with:
          script: |
            const title = 'Entra service-principal canary is failing';
            const outcome = process.env.CANARY_OUTCOME;
            const report = process.env.CANARY_REPORT || '(no report captured)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'canary',
              per_page: 100,
            });
            const alert = existing.data.find(issue => issue.title === title);

            if (outcome === 'success') {
              if (alert) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  body: `The service-principal canary passed again in [run ${context.runId}](${runUrl}). Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  state: 'closed',
                });
              }
              return;
            }

            // An AADSTS code in the report means Entra answered and refused. That is the tenant - an
            // expired secret or certificate, a revoked grant, a disabled service principal - and not
            // the module, so the alert must not send anyone to read signing code over it.
            const entraCode = report.match(/AADSTS\d+/);

            const diagnosis = entraCode
              ? [
                  `**Entra ID refused the request (\`${entraCode[0]}\`).** That is tenant configuration or an expired credential, not a change in this module.`,
                  ``,
                  `**What to do.** \`AADSTS7000222\` is an expired client secret and \`AADSTS700027\` an expired or unregistered certificate; either is fixed by re-running \`Build/New-EntraCanaryConfiguration.ps1 -RotateServicePrincipalCredential -GitHubRepository <owner/repo>\`. For anything else, look up the code and see \`docs/entra-canary.md\`.`,
                ]
              : [
                  `**Entra ID did not refuse the request, so read the failed assertions below.** A token that never arrived, a token missing the application role, or claims that do not match the resource all point somewhere different.`,
                  ``,
                  `**What to do.** If no bearer token reached the resource, remember that \`Invoke-OAuth2Authentication\` continues with an empty bearer when the token request fails - the status code proves nothing on its own. See \`docs/entra-canary.md\`.`,
                ];

            const body = [
              `A scheduled Entra ID service-principal canary scenario failed twice in a row, so this is not a transient hiccup. The report below names the credential form.`,
              ``,
              `No browser is involved in this canary, so this is **not** a sign-in page change.`,
              ``,
              ...diagnosis,
              ``,
              `[Run ${context.runId}](${runUrl})`,
              ``,
              report,
            ].join('\n');

            if (alert) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                body,
              });
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'canary',
                color: 'fbca04',
                description: 'Raised automatically by the scheduled Entra canaries',
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['canary'],
            });
